name: Release infra-toolkit

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: infra-toolkit-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          existing_tag="$(
            git tag \
              --points-at "${GITHUB_SHA}" \
              --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | sort -V \
            | tail -n 1
          )"

          if [[ -n "${existing_tag}" ]]; then
            tag="${existing_tag}"
            create_tag=false
          else
            latest_tag="$(
              git tag \
                --list 'v[0-9]*.[0-9]*.[0-9]*' \
                --sort=-v:refname \
              | head -n 1
            )"

            if [[ -z "${latest_tag}" ]]; then
              tag="v1.0.0"
            else
              if [[ ! "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "ERROR: latest tag is not valid semver: ${latest_tag}" >&2
                exit 1
              fi

              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi

            create_tag=true
          fi

          if [[ ! "${tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: calculated tag is invalid: ${tag}" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          major_minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "major_minor=${major_minor}"
            echo "create_tag=${create_tag}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${tag}"
          echo "Image version: ${version}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create Git tag
        if: steps.version.outputs.create_tag == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            --annotate "${RELEASE_TAG}" \
            --message "Release ${RELEASE_TAG}" \
            "${GITHUB_SHA}"

          git push origin "refs/tags/${RELEASE_TAG}"
